name: sign_app
description: Sinhala Sign Language translation app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  image: ^4.2.0
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/home.png
    - assets/images/educa.png